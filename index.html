<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac tOdin</title>
</head>
<link rel="stylesheet" href="style.css" />

<body>
    <h1>Tic Tac tOdin</h1>
    <div id="player-turn">Player 1's turn (X)</div>

    <div id="player-inputs">
        <label>
            Player 1 name:
            <input type="text" id="player1-name" placeholder="Player 1">
        </label>
        <label>
            Player 2 name:
            <input type="text" id="player2-name" placeholder="Player 2">
        </label>
        <button id="start-button">Start / Apply Names</button>
    </div>
    <div id="game-grid">
        <div class="block" id="block-0"></div>
        <div class="block" id="block-1"></div>
        <div class="block" id="block-2"></div>
        <div class="block" id="block-3"></div>
        <div class="block" id="block-4"></div>
        <div class="block" id="block-5"></div>
        <div class="block" id="block-6"></div>
        <div class="block" id="block-7"></div>
        <div class="block" id="block-8"></div>
    </div>
    <button id="reset-button">Reset Game</button>
    <script src="script.js"> </script>
</body>

</html>
